spring.application.name=memoflow

# Zmienne z pliku .env w katalogu głównym repozytorium (jedno źródło prawdy z Docker Compose).
# Dwie ścieżki, bo katalog roboczy z IDE to katalog główny albo backend/. "optional:" = brak pliku nie jest błędem.
# Prawdziwe zmienne środowiskowe (np. w Dockerze) mają pierwszeństwo przed plikiem.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Baza danych (SPEC, sekcja 17). Hasło bez wartości domyślnej: nie trafia do repozytorium.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:memoflow}
spring.datasource.username=${DB_USER:memoflow}
spring.datasource.password=${DB_PASSWORD}

# Schemat tworzy Liquibase, Hibernate tylko sprawdza zgodność encji (SPEC, sekcja 5).
spring.jpa.hibernate.ddl-auto=validate
# Sesja Hibernate kończy się razem z transakcją w serwisie, nie trzyma połączenia do końca żądania HTTP.
spring.jpa.open-in-view=false

# Wirtualne wątki z Javy 21 (SPEC, sekcja 9).
spring.threads.virtual.enabled=true

# Strefa dla "dzisiaj" w algorytmie i zapytaniach (SPEC, sekcja 6).
memoflow.zone=Europe/Warsaw

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml